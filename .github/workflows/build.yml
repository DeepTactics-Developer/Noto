name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
          ls /Applications | grep -i xcode
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project Noto.xcodeproj -scheme Noto \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
      - name: Unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPad' in x['name']))")
          echo "Simulator: $UDID"
          xcodebuild test \
            -project Noto.xcodeproj -scheme Noto \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO
