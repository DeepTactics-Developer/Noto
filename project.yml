name: Noto
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Noto:
    type: application
    platform: iOS
    sources: [Noto]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deeptactics.noto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [NotoTests]
    info:
      path: Noto/Info.plist
      properties:
        CFBundleDisplayName: Noto
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: 필기와 함께 음성을 녹음하려면 마이크 접근 권한이 필요합니다.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  NotoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NotoTests]
    dependencies:
      - target: Noto
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deeptactics.noto.tests
        GENERATE_INFOPLIST_FILE: YES
